name: All-Scopes Env Build

# Builds nix/flake.nix with every scope in scopes.json enabled at once and
# verifies each scope's declared `# bins:` land in the result.
#
# Why a dedicated workflow: the integration matrices install a handful of
# scopes each, so a package that collides with a package from another scope
# (minikube's bin/kubectl vs the real kubectl, v1.19.4) only fails for users
# who happen to combine them.
#
# This holds the *revision* fixed and varies the *repo*: it builds against
# whatever nix/nixpkgs_rev.json pins, so it answers "does this change to the
# scopes break the env?". bump_nixpkgs_rev.yml is the mirror image - repo fixed,
# revision varied - and never runs on a PR, so it cannot cover this. Both
# variables break the build independently; neither workflow subsumes the other.
#
# No schedule: a weekly run would rebuild the same pinned revision, which is
# nearly a no-op. Detecting nixpkgs-unstable drift is bump_nixpkgs_rev.yml's
# job, and it builds the candidate on both platforms every Monday.
#
# Triggers:
#   1. PR touching the scope definitions, the flake, the pinned rev, or the check
#   2. Manual dispatch (pick the scope list)

on:
  pull_request:
    paths:
      - "nix/scopes/**"
      - "nix/flake.nix"
      # A hand-edited pin (e.g. rolling back a bad revision) still needs the
      # all-scopes build. The weekly bot PR does not double up here: a PR opened
      # with GITHUB_TOKEN does not trigger pull_request workflows, and the bump
      # workflow gated that revision inline before opening it.
      - "nix/nixpkgs_rev.json"
      - ".assets/lib/scopes.json"
      - "tests/nix/build_scope_env.sh"
      - ".github/workflows/test_scope_env.yml"

  workflow_dispatch:
    inputs:
      scopes:
        description: "Scope names (space-separated, empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-env:
    # macOS is skipped on PRs (slow, paid minutes). Darwin - where the package
    # set and its collisions differ - is covered weekly by bump_nixpkgs_rev.yml's
    # macos-15 gate, and on demand via workflow_dispatch here.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-slim"]') || fromJSON('["ubuntu-slim", "macos-15"]') }}

    name: "all scopes on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # The all-scopes closure is ~3.5 GB before the env itself is built.
      - name: Show free disk space
        run: df -h /

      - name: Build all-scopes env and verify declared bins
        # The dispatch input reaches the script as one quoted argument via the
        # environment - never interpolated into the run block, never evaluated.
        env:
          SCOPES: ${{ github.event.inputs.scopes }}
        run: |
          if [ -n "$SCOPES" ]; then
            tests/nix/build_scope_env.sh --scopes "$SCOPES"
          else
            tests/nix/build_scope_env.sh
          fi
