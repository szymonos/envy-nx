repos:
  - repo: local
    hooks:
      - id: gremlins-check
        name: Detect gremlins / unwanted Unicode characters
        entry: python3 -m tests.hooks.gremlins
        language: system
        types: [text]
      - id: validate-docs-words
        name: validate docs words
        entry: python3 -m tests.hooks.validate_docs_words
        language: system
        pass_filenames: false
        files: \.md$
      - id: align-tables
        name: align markdown tables
        entry: python3 -m tests.hooks.align_tables
        language: system
        files: \.md$
      - id: validate-scopes
        name: Validate scope definitions consistency
        entry: python3 -m tests.hooks.validate_scopes
        language: system
        files: (\.assets/lib/scopes\.json|nix/scopes/.*\.nix|nix/lib/phases/bootstrap\.sh)
        pass_filenames: false
      - id: check-bash32
        name: Check nix-path scripts for bash 3.2 / BSD compatibility
        entry: python3 -m tests.hooks.check_bash32
        language: system
        files: (nix/.*\.sh$|\.assets/lib/(scopes|profile_block|nx|nx_pkg|nx_scope|nx_profile|nx_lifecycle|nx_doctor|helpers)\.sh$|\.assets/config/shell_cfg/(aliases_nix|aliases_git|aliases_kubectl|functions)\.sh$|\.assets/setup/setup_common\.sh$|\.assets/provision/install_copilot\.sh$)
        types: [file]
      - id: check-zsh-compat
        name: Check shell-sourced scripts for zsh compatibility
        entry: python3 -m tests.hooks.check_zsh_compat
        language: system
        files: (\.assets/config/shell_cfg/.*\.sh$|\.assets/lib/(nx|nx_pkg|nx_scope|nx_profile|nx_lifecycle|profile_block)\.sh$)
        types: [file]
      - id: check-no-tty-read
        name: Forbid `read ... </dev/tty` without `# tty-ok` marker
        entry: python3 -m tests.hooks.check_no_tty_read
        language: system
        files: ^(\.assets/|nix/|wsl/|modules/).*\.(sh|zsh|bash)$
      - id: check-no-aliased-builtins
        name: Forbid bare `mv`/`cp` in interactively-sourced shell files
        entry: python3 -m tests.hooks.check_no_aliased_builtins
        language: system
        # File list owned by tests/hooks/_file_scopes.py::ALIASED_BUILTINS_FILES.
        # Keep this regex in sync when you add or remove an INTERACTIVE_SHELL
        # entry there. (Future: gen_pre_commit_scopes.py will codegen this.)
        files: (\.assets/config/shell_cfg/(aliases_git|aliases_kubectl|aliases_nix|functions)\.sh$|\.assets/lib/(nx|nx_pkg|nx_scope|nx_profile|nx_lifecycle|nx_doctor|profile_block|helpers|certs|env_block)\.sh$)
        types: [file]
      - id: check-distro-case-arm
        name: Require a `*)` arm on distro case statements
        entry: python3 -m tests.hooks.check_distro_case_arm
        language: system
        # Deliberately every shell file in the repo: the hook scopes by CONTENT
        # (the file must detect a distro id). A directory filter would let a
        # distro-aware installer outside these trees escape the hook entirely.
        files: \.(sh|zsh|bash)$
      - id: check-curl-tls
        name: Require `--proto '=https' --tlsv1.2` on curl/wget fetches
        entry: python3 -m tests.hooks.check_curl_tls
        language: system
        files: ^(\.assets/|nix/).*\.(sh|zsh|bash)$
      - id: check-md-html-tags
        name: Forbid unbalanced tag-like '<...' in mkdocs-published Markdown
        entry: python3 -m tests.hooks.check_md_html_tags
        language: system
        files: ^docs/.*\.md$
      - id: check-nx-generated
        name: Check nx generated artifacts (completers, help, dispatch, lib-files) match nx_surface.json
        entry: python3 -m tests.hooks.check_nx_completions
        language: system
        pass_filenames: false
        files: (\.assets/lib/nx_surface\.json|\.assets/lib/(nx|nx_lifecycle|nx_doctor)\.sh|\.assets/config/shell_cfg/completions\.(bash|zsh)|\.assets/config/pwsh_cfg/_aliases_nix\.ps1|nix/lib/phases/bootstrap\.sh|tests/hooks/(gen|check)_nx_completions\.py)
      - id: bats-tests
        name: Run bats unit tests
        entry: python3 -m tests.hooks.run_bats
        language: system
        types: [file]
        pass_filenames: true
      - id: pester-tests
        name: Run Pester unit tests
        entry: python3 -m tests.hooks.run_pester
        language: system
        types: [file]
        pass_filenames: true
      - id: check-changelog
        name: Check CHANGELOG updated for runtime changes
        entry: python3 -m tests.hooks.check_changelog
        language: system
        pass_filenames: true
        files: (CHANGELOG\.md|nix/|\.assets/lib/|\.assets/config/|\.assets/setup/|\.assets/provision/|wsl/)
      - id: check-learning-trailer
        name: Nudge for Codified-Learning trailer on high-leverage changes
        entry: python3 -m tests.hooks.check_learning_trailer
        language: system
        stages: [commit-msg]
        always_run: true
      - id: check-skills
        name: validate Claude Skills frontmatter (spec compliance)
        entry: tests/hooks/check_skills.py
        language: script
        files: ^\.(claude|github)/skills/[^/]+/SKILL\.md$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
        exclude: \.(css|js)$
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: \.md$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
        files: ^(tests|\.claude/skills)/
      - id: ruff-format
        types_or: [python, pyi]
        files: ^(tests|\.claude/skills)/
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
        files: \.md$
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        files: \.md$
        # Upstream's default args include `--gitignore`, which resolves each
        # path against .gitignore. Agent worktrees live under /.claude/worktrees/
        # (gitignored), so inside one cspell checks ZERO files and reports
        # Passed. pre-commit only passes tracked files, so --gitignore filters
        # nothing we want anyway.
        # `--files` must stay last: pre-commit appends the paths after it.
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --files
      - id: cspell
        name: check commit message spelling
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
        stages: [commit-msg]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude: \.zsh$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        exclude: \.zsh$
